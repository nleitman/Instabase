<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mock Instabase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <span class="logo">&#9670;</span>
      <span class="logo-text">Mock Instabase</span>
    </div>
  </header>

  <div class="toolbar">
    <label for="doc-select">Document</label>
    <div class="doc-select-group">
      <select id="doc-select">
        <option value="">— select a document —</option>
      </select>
      <label class="icon-btn" id="upload-label" title="Add document">
        &#43;
        <input type="file" id="file-input" accept=".txt,.md,.csv,.json,.pdf,.jpg,.jpeg,.png" hidden />
      </label>
      <button class="icon-btn icon-btn-danger" id="delete-doc-btn" disabled title="Delete document">
        &#10005;
      </button>
    </div>
    <div id="upload-status" class="upload-status hidden"></div>
  </div>

  <main>
    <!-- Left: Document viewer -->
    <section class="doc-pane">
      <div class="pane-header">Document Viewer</div>
      <div id="doc-content" class="doc-content">
        <span class="placeholder">Select a document to view its contents.</span>
      </div>
    </section>

    <!-- Right: Config + Results -->
    <section class="side-pane">

      <!-- Config panel (Fields + Classes tabs) -->
      <div class="panel" id="config-panel">

        <div class="tabs">
          <button class="tab active" data-tab="fields">Fields</button>
          <button class="tab" data-tab="classes">Classes</button>
        </div>

        <!-- Fields tab -->
        <div class="tab-pane" id="tab-fields">
          <div id="fields-list"></div>
          <button class="btn btn-ghost" id="add-field-btn">
            <span class="icon">+</span> Add Field
          </button>
        </div>

        <!-- Classes tab -->
        <div class="tab-pane hidden" id="tab-classes">
          <div id="classes-list"></div>
          <button class="btn btn-ghost" id="add-class-btn">
            <span class="icon">+</span> Add Class
          </button>
        </div>

        <button class="btn btn-primary" id="run-btn" disabled>
          &#9654; Run Extraction
        </button>
        <div id="run-status" class="run-status hidden"></div>
      </div>

      <!-- Results panel -->
      <div class="panel" id="results-panel">
        <div class="panel-header">
          <span>Results</span>
          <div class="panel-header-actions">
            <button class="btn btn-danger btn-sm" id="clear-btn">&#10005; Clear</button>
            <button class="btn btn-danger btn-sm" id="clear-all-btn">&#10005; Clear All</button>
          </div>
        </div>
        <div id="results-content">
          <span class="placeholder">Run extraction to see results.</span>
        </div>
      </div>

    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
